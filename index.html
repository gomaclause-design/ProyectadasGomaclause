<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Muro de las Proyectadas</title>
  
  <!-- SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root {
      --bg: #090c10;
      --card-bg: #12161f;
      --border: #252d3a;
      --accent: #79a8d8;
      --text: #c9d1d9;
      --text-muted: #6e7681;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px 14px 90px 14px; 
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 650px; }

    /* Cabecera */
    .hero-banner {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
      text-align: center;
    }
    .hero-banner img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      filter: brightness(0.85) contrast(1.05);
    }
    .hero-title { padding: 16px; }
    .hero-title h1 {
      font-size: 23px;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .hero-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      font-style: italic;
    }

    /* Formulario */
    form {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 18px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    input[type="text"], textarea, select {
      background: #090c10;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
    }
    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .form-row > * { flex: 1; min-width: 140px; }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* Galería */
    .file-upload-box {
      border: 1px dashed var(--border);
      padding: 12px;
      border-radius: 8px;
      background: #090c10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .file-btn-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .custom-file-btn {
      background: #182230;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .custom-file-btn:hover { background: #212d40; }
    #input-file { display: none; }
    .file-status { font-size: 12px; color: var(--text-muted); }

    .preview-box {
      display: none;
      position: relative;
      width: 100%;
      max-height: 220px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .preview-box img {
      width: 100%;
      height: 100%;
      max-height: 220px;
      object-fit: cover;
      display: block;
    }
    .btn-remove-img {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #f85149;
      color: #f85149;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Slider */
    .hype-container {
      background: #090c10;
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 6px;
    }
    .hype-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #79a8d8;
    }

    .btn-submit {
      background: #1f364d;
      color: #c9d1d9;
      font-weight: bold;
      border: 1px solid #388bfd44;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-submit:hover { background: #264766; color: #fff; }

    /* Pestañas */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
    }
    .tab-btn.active {
      color: #fff;
      background: var(--card-bg);
      border: 1px solid var(--border);
    }

    /* Tarjetas */
    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      position: relative;
    }
    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #30363d;
    }
    .user-info { flex: 1; }
    .author-name { font-weight: bold; font-size: 15px; color: var(--accent); }
    .post-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background: #182230;
      color: #79c0ff;
      border: 1px solid #388bfd33;
    }
    .post-body {
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 12px;
      color: #d0d7de;
    }

    .post-image-box {
      width: 100%;
      max-height: 380px;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
      background: #090c10;
      border: 1px solid var(--border);
    }
    .post-image-box img {
      width: 100%;
      height: 100%;
      max-height: 380px;
      object-fit: cover;
      display: block;
    }

    .card-hype-bar {
      height: 3px;
      border-radius: 2px;
      background: #182230;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .card-hype-fill {
      height: 100%;
      background: linear-gradient(90deg, #388bfd, #8957e5);
    }

    .post-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .reactions { display: flex; gap: 6px; }
    .react-btn, .btn-capture {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .react-btn:hover, .btn-capture:hover { background: #1c2128; }
    .react-btn.reacted { border-color: var(--accent); color: var(--accent); }

    /* Botón flotante de WhatsApp */
    .whatsapp-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #12161f;
      border: 1px solid #25d36644;
      padding: 8px 14px 8px 10px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      transition: all 0.25s ease;
    }
    .whatsapp-float:hover {
      background: #17202c;
      border-color: #25d366;
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(37, 211, 102, 0.25);
    }
    .wa-icon-circle {
      width: 36px;
      height: 36px;
      background: #25d366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .wa-icon-circle svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }
    .wa-text {
      color: #e6edf3;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Banner Principal -->
    <div class="hero-banner">
      <img src="https://i.postimg.cc/Y2xk6G7V/Proyectado1.webp" alt="Proyectado Despecho" />
      <div class="hero-title">
        <h1>🌧️ El Muro de las Proyectadas 🚬</h1>
        <p>"Desahógate aquí, no le mandes mensaje a las 3:00 AM..."</p>
      </div>
    </div>

    <!-- Formulario de Publicación -->
    <form id="proyectada-form">
      <div class="form-row">
        <input type="text" id="autor" placeholder="Tu alias (ej: @despechado_3000)" required maxlength="25" />
        <select id="categoria">
          <option value="LaExtraño">💔 #LaExtraño</option>
          <option value="Sadboy">🌧️ #Sadboy</option>
          <option value="Insomnio">🌙 #NochesDeInsomnio</option>
          <option value="MeIlusioné">🥀 #MeIlusioné</option>
          <option value="Sobrepensando">💭 #Sobrepensando</option>
          <option value="Desahogo">🕯️ #Desahogo</option>
        </select>
      </div>

      <label class="checkbox-label">
        <input type="checkbox" id="anonimo-check" />
        Postear como <strong>@ProyectadoAnonimo</strong> 🕶️
      </label>

      <textarea id="contenido" rows="3" placeholder="Suelte ese desahogo melancólico que lleva guardado..." required></textarea>

      <!-- Selector de foto de galería -->
      <div class="file-upload-box">
        <div class="file-btn-wrapper">
          <label for="input-file" class="custom-file-btn">
            🖼️ Elegir foto de galería
          </label>
          <input type="file" id="input-file" accept="image/*" />
          <span class="file-status" id="file-status">Ninguna imagen seleccionada</span>
        </div>
        
        <div class="preview-box" id="preview-box">
          <img id="preview-img" src="" alt="Previsualización" />
          <button type="button" class="btn-remove-img" onclick="quitarImagen()">✕</button>
        </div>
      </div>

      <!-- Medidor de Bajón -->
      <div class="hype-container">
        <div class="hype-header">
          <span>Nivel de Dolor / Bajón:</span>
          <span id="hype-value" style="color: #79a8d8;">50% Bajón</span>
        </div>
        <input type="range" id="hype-range" min="1" max="100" value="50" oninput="actualizarHypeText(this.value)" />
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Soltar Proyección Sad</button>
    </form>

    <!-- Pestañas de Vista -->
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-feed" onclick="cambiarVista('feed')">📜 Muro Completo</button>
      <button class="tab-btn" id="tab-cine" onclick="cambiarVista('cine')">🎥 Proyector de Cine (Top Proyecciones)</button>
    </div>

    <!-- Lista del Feed / Contenedor de Errores -->
    <div id="posts-container">Cargando proyecciones...</div>

  </div>

  <!-- Botón Flotante de WhatsApp -->
  <a href="https://chat.whatsapp.com/Im4wBFiyQwdFxHy7dIWoIR" target="_blank" rel="noopener noreferrer" class="whatsapp-float">
    <div class="wa-icon-circle">
      <svg viewBox="0 0 24 24">
        <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm.01 1.67c2.2 0 4.26.86 5.82 2.42a8.17 8.17 0 0 1 2.41 5.82c0 4.54-3.7 8.24-8.24 8.24-1.44 0-2.85-.38-4.09-1.11l-.29-.17-3.05.8 0.82-2.97-.19-.3a8.21 8.21 0 0 1-1.26-4.48c0-4.54 3.7-8.24 8.24-8.24zm4.52 11.59c-.25-.12-1.47-.72-1.7-.8-.23-.08-.39-.12-.56.12-.17.25-.64.8-.79.97-.14.17-.29.19-.54.07-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.38-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.35-.77-1.85-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.12.17 1.77 2.7 4.29 3.79.6.26 1.07.41 1.43.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.23-.17-.48-.29z"/>
      </svg>
    </div>
    <span class="wa-text">Únete a nuestro grupo de WhatsApp</span>
  </a>

  <script>
    // --- ESTA FUE LA SOLUCIÓN: Cambiamos "supabase" por "db" ---
    const SUPABASE_URL = "https://flwunvjuvudfpwkszlgn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_gmT2QjKFkJOyP5cmrySmQA_XbKQWlMS";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let vistaActual = 'feed';
    let postsData = [];
    let imagenBase64 = null;

    const AVATAR_1 = "https://i.postimg.cc/y6TBmgK2/Proyectado2.webp";
    const AVATAR_2 = "https://i.postimg.cc/PqZnPNKV/670b134a-0bde-4bde-960d-cfb4aa4eb982.jpg";

    window.actualizarHypeText = function(val) {
      document.getElementById("hype-value").innerText = `${val}% Bajón`;
    };

    window.cambiarVista = function(vista) {
      vistaActual = vista;
      document.getElementById('tab-feed').classList.toggle('active', vista === 'feed');
      document.getElementById('tab-cine').classList.toggle('active', vista === 'cine');
      renderPosts();
    };

    document.getElementById("anonimo-check").addEventListener("change", function(e) {
      const autorInput = document.getElementById("autor");
      if (e.target.checked) {
        autorInput.removeAttribute("required");
        autorInput.disabled = true;
      } else {
        autorInput.setAttribute("required", "true");
        autorInput.disabled = false;
      }
    });

    document.getElementById("input-file").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.src = event.target.result;
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 800;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          imagenBase64 = canvas.toDataURL("image/jpeg", 0.75);

          document.getElementById("preview-img").src = imagenBase64;
          document.getElementById("preview-box").style.display = "block";
          document.getElementById("file-status").innerText = file.name;
        };
      };
      reader.readAsDataURL(file);
    });

    window.quitarImagen = function() {
      imagenBase64 = null;
      document.getElementById("input-file").value = "";
      document.getElementById("preview-box").style.display = "none";
      document.getElementById("preview-img").src = "";
      document.getElementById("file-status").innerText = "Ninguna imagen seleccionada";
    };

    async function cargarPosts() {
      try {
        const { data, error } = await db
          .from("proyectadas")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) throw error;
        
        postsData = data;
        renderPosts();
      } catch (err) {
        document.getElementById("posts-container").innerHTML = `
          <div style="background: #3a1515; border: 1px solid #f85149; padding: 16px; border-radius: 8px; color: #ff7b72;">
            <h3 style="margin-top:0;">❌ Error al cargar la base de datos:</h3>
            <p>${err.message || JSON.stringify(err)}</p>
          </div>
        `;
      }
    }

    function renderPosts() {
      const container = document.getElementById("posts-container");
      let lista = [...postsData];

      if (vistaActual === 'cine') {
        lista.sort((a, b) => {
          const scoreA = (a.chad_count || 0) + (a.fuego_count || 0) + (a.skull_count || 0);
          const scoreB = (b.chad_count || 0) + (b.fuego_count || 0) + (b.skull_count || 0);
          return scoreB - scoreA;
        });
      }

      if (lista.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px;">No hay desahogos todavía. Sé el primero en proyectarte.</div>`;
        return;
      }

      container.innerHTML = lista.map((post, idx) => {
        const avatarUrl = (post.id % 2 === 0) ? AVATAR_1 : AVATAR_2;

        let postImgHtml = "";
        if (post.imagen_url && post.imagen_url.trim() !== "") {
          postImgHtml = `
            <div class="post-image-box">
              <img src="${post.imagen_url}" alt="Adjunto" loading="lazy" />
            </div>
          `;
        }

        return `
          <div class="post-card" id="card-${post.id}">
            <div class="post-header">
              <img class="avatar" src="${avatarUrl}" alt="Avatar" />
              <div class="user-info">
                <div class="author-name">${escapeHtml(post.autor)}</div>
                <div style="font-size: 11px; color: var(--text-muted);">
                  ${new Date(post.created_at).toLocaleDateString()} • <span class="post-tag">#${escapeHtml(post.categoria || 'Desahogo')}</span>
                </div>
              </div>
              ${vistaActual === 'cine' && idx === 0 ? '<span style="font-size: 20px;" title="Proyección Suprema">👑</span>' : ''}
            </div>

            <div class="card-hype-bar">
              <div class="card-hype-fill" style="width: ${post.hype_level || 50}%"></div>
            </div>

            <div class="post-body">${escapeHtml(post.contenido)}</div>

            ${postImgHtml}

            <div class="post-footer">
              <div class="reactions">
                <button class="react-btn ${haVotado(post.id, 'chad') ? 'reacted' : ''}" 
                  onclick="votar(${post.id}, 'chad')">
                  💔 <span>${post.chad_count || 0}</span>
                </button>
                <button class="react-btn ${haVotado(post.id, 'fuego') ? 'reacted' : ''}" 
                  onclick="votar(${post.id}, 'fuego')">
                  🚬 <span>${post.fuego_count || 0}</span>
                </button>
                <button class="react-btn ${haVotado(post.id, 'skull') ? 'reacted' : ''}" 
                  onclick="votar(${post.id}, 'skull')">
                  💀 <span>${post.skull_count || 0}</span>
                </button>
              </div>

              <button class="btn-capture" onclick="descargarTarjeta(${post.id})">
                📸 Captura
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    window.haVotado = function(id, tipo) {
      return localStorage.getItem(`reacc_${id}_${tipo}`) === "true";
    }

    window.votar = async function(id, tipo) {
      if (haVotado(id, tipo)) return;
      localStorage.setItem(`reacc_${id}_${tipo}`, "true");

      await db.rpc("reaccionar", { post_id: id, tipo_reaccion: tipo });
      cargarPosts();
    };

    window.descargarTarjeta = function(id) {
      const card = document.getElementById(`card-${id}`);
      html2canvas(card, { backgroundColor: "#12161f", scale: 2, useCORS: true }).then(canvas => {
        const link = document.createElement("a");
        link.download = `proyectada-${id}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    };

    document.getElementById("proyectada-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.innerText = "Publicando...";

      const isAnon = document.getElementById("anonimo-check").checked;
      const autorInput = document.getElementById("autor").value.trim();
      
      const autor = isAnon ? "@ProyectadoAnonimo" : (autorInput || "@ProyectadoAnonimo");
      const contenido = document.getElementById("contenido").value.trim();
      const categoria = document.getElementById("categoria").value;
      const hype_level = parseInt(document.getElementById("hype-range").value);

      try {
        const { error } = await db.from("proyectadas").insert([{
          autor,
          contenido,
          categoria,
          hype_level,
          imagen_url: imagenBase64
        }]);

        if (error) throw error;

        document.getElementById("contenido").value = "";
        quitarImagen();
        cargarPosts();
      } catch (err) {
        document.getElementById("posts-container").innerHTML = `
          <div style="background: #3a1515; border: 1px solid #f85149; padding: 16px; border-radius: 8px; color: #ff7b72; margin-top:10px;">
            <h3 style="margin-top:0;">❌ Error al Postear:</h3>
            <p>${err.message || JSON.stringify(err)}</p>
          </div>
        `;
      } finally {
        btn.disabled = false;
        btn.innerText = "Soltar Proyección Sad";
      }
    });

    try {
      db.channel("muro-realtime")
        .on("postgres_changes", { event: "*", schema: "public", table: "proyectadas" }, () => {
          cargarPosts();
        })
        .subscribe();
    } catch (e) {
      console.log("No se pudo iniciar realtime");
    }

    function escapeHtml(str) {
      return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Arrancar la magia
