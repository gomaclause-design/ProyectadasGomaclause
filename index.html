<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Muro de las Proyectadas</title>
  <!-- SDK Supabase y html2canvas -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root {
      --bg: #090c10;
      --card-bg: #12161f;
      --border: #252d3a;
      --accent: #79a8d8;
      --sad-blue: #58a6ff;
      --text: #c9d1d9;
      --text-muted: #6e7681;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { width: 100%; max-width: 650px; }

    /* Cabecera con la primera imagen */
    .hero-banner {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
      text-align: center;
    }
    .hero-banner img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      filter: brightness(0.85) contrast(1.05);
    }
    .hero-title {
      padding: 16px;
    }
    .hero-title h1 {
      font-size: 23px;
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .hero-title p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      font-style: italic;
    }

    /* Formulario */
    form {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 18px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    input[type="text"], input[type="url"], textarea, select {
      background: #090c10;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
    }
    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .form-row > * { flex: 1; min-width: 140px; }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* Slider de Nivel de Bajón */
    .hype-container {
      background: #090c10;
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 6px;
    }
    .hype-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #79a8d8;
    }

    .btn-submit {
      background: #1f364d;
      color: #c9d1d9;
      font-weight: bold;
      border: 1px solid #388bfd44;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-submit:hover { background: #264766; color: #fff; }

    /* Barra de filtros */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
    }
    .tab-btn.active {
      color: #fff;
      background: var(--card-bg);
      border: 1px solid var(--border);
    }

    /* Tarjetas del Feed */
    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      position: relative;
    }
    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #30363d;
    }
    .user-info { flex: 1; }
    .author-name { font-weight: bold; font-size: 15px; color: var(--accent); }
    .post-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background: #182230;
      color: #79c0ff;
      border: 1px solid #388bfd33;
    }
    .post-body {
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 12px;
      color: #d0d7de;
    }

    /* Imagen adjunta en el post */
    .post-image-box {
      width: 100%;
      max-height: 380px;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
      background: #090c10;
      border: 1px solid var(--border);
    }
    .post-image-box img {
      width: 100%;
      height: 100%;
      max-height: 380px;
      object-fit: cover;
      display: block;
    }

    /* Barra de bajón en la tarjeta */
    .card-hype-bar {
      height: 3px;
      border-radius: 2px;
      background: #182230;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .card-hype-fill {
      height: 100%;
      background: linear-gradient(90deg, #388bfd, #8957e5);
    }

    /* Acciones inferiores */
    .post-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .reactions { display: flex; gap: 6px; }
    .react-btn, .btn-capture {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .react-btn:hover, .btn-capture:hover { background: #1c2128; }
    .react-btn.reacted { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Banner Principal (Primera Imagen) -->
    <div class="hero-banner">
      <img src="https://i.postimg.cc/Y2xk6G7V/Proyectado1.webp" alt="Proyectado Despecho" />
      <div class="hero-title">
        <h1>🌧️ El Muro de las Proyectadas 🚬</h1>
        <p>"Desahógate aquí, no le mandes mensaje a las 3:00 AM..."</p>
      </div>
    </div>

    <!-- Formulario de Publicación -->
    <form id="proyectada-form">
      <div class="form-row">
        <input type="text" id="autor" placeholder="Tu alias (ej: @despechado_3000)" required maxlength="25" />
        <select id="categoria">
          <option value="LaExtraño">💔 #LaExtraño</option>
          <option value="Sadboy">🌧️ #Sadboy</option>
          <option value="Insomnio">🌙 #NochesDeInsomnio</option>
          <option value="MeIlusioné">🥀 #MeIlusioné</option>
          <option value="Sobrepensando">💭 #Sobrepensando</option>
          <option value="Desahogo">🕯️ #Desahogo</option>
        </select>
      </div>

      <label class="checkbox-label">
        <input type="checkbox" id="anonimo-check" />
        Postear como <strong>@ProyectadoAnonimo</strong> 🕶️
      </label>

      <textarea id="contenido" rows="3" placeholder="Suelte ese desahogo melancólico que lleva guardado..." required></textarea>

      <!-- Campo de Imagen Opcional -->
      <input type="url" id="imagen-url" placeholder="Enlace de imagen o meme (opcional - https://...)" />

      <!-- Medidor de Bajón Emocional -->
      <div class="hype-container">
        <div class="hype-header">
          <span>Nivel de Dolor / Bajón:</span>
          <span id="hype-value" style="color: #79a8d8;">50% Bajón</span>
        </div>
        <input type="range" id="hype-range" min="1" max="100" value="50" oninput="actualizarHypeText(this.value)" />
      </div>

      <button type="submit" class="btn-submit">Soltar Proyección Sad</button>
    </form>

    <!-- Pestañas de Vista -->
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-feed" onclick="cambiarVista('feed')">📜 Muro Completo</button>
      <button class="tab-btn" id="tab-cine" onclick="cambiarVista('cine')">🎥 Proyector de Cine (Top Proyecciones)</button>
    </div>

    <!-- Lista del Feed -->
    <div id="posts-container">Cargando proyecciones...</div>

  </div>

  <script>
    const SUPABASE_URL = "https://flwunvjuvudfpwkszlgn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_gmT2QjKFkJOyP5cmrySmQA_XbKQWlMS";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let vistaActual = 'feed';
    let postsData = [];

    // Avatares asignados para los posts (alternando las otras 2 imágenes)
    const AVATAR_1 = "https://i.postimg.cc/y6TBmgK2/Proyectado2.webp";
    const AVATAR_2 = "https://i.postimg.cc/PqZnPNKV/670b134a-0bde-4bde-960d-cfb4aa4eb982.jpg";

    function actualizarHypeText(val) {
      document.getElementById("hype-value").innerText = `${val}% Bajón`;
    }

    function cambiarVista(vista) {
      vistaActual = vista;
      document.getElementById('tab-feed').classList.toggle('active', vista === 'feed');
      document.getElementById('tab-cine').classList.toggle('active', vista === 'cine');
      renderPosts();
    }

    async function cargarPosts() {
      const { data, error } = await supabase
        .from("proyectadas")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        document.getElementById("posts-container").innerText = "Error al cargar las proyecciones.";
        console.error(error);
        return;
      }
      postsData = data;
      renderPosts();
    }

    function renderPosts() {
      const container = document.getElementById("posts-container");
      let lista = [...postsData];

      if (vistaActual === 'cine') {
        lista.sort((a, b) => {
          const scoreA = (a.chad_count || 0) + (a.fuego_count || 0) + (a.skull_count || 0);
          const scoreB = (b.chad_count || 0) + (b.fuego_count || 0) + (b.skull_count || 0);
          return scoreB - scoreA;
        });
      }

      if (lista.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px;">No hay desahogos todavía. Sé el primero en proyectarte.</div>`;
        return;
      }

      container.innerHTML = lista.map((post, idx) => {
        const avatarUrl = (post.id % 2 === 0) ? AVATAR_1 : AVATAR_2;

        let postImgHtml = "";
        if (post.imagen_url && post.imagen_url.trim() !== "") {
          postImgHtml = `
            <div class="post-image-box">
              <img src="${escapeHtml(post.imagen_url)}" alt="Adjunto" loading="lazy" onerror="this.parentElement.style.display='none'" />
            </div>
          `;
        }

        return `
          <div class="post-card" id="card-${post.id}">
            <div class="post-header">
              <img class="avatar" src="${avatarUrl}" alt="Avatar" />
              <div class="user-info">
                <div class="author-name">${escapeHtml(post.autor)}</div>
                <div style="font-size: 11px; color: var(--text-muted);">
                  ${new Date(post.created_at).toLocaleDateString()} • <span class="post-tag">#${escapeHtml(post.categoria || 'Desahogo')}</span>
                </div>
              </div>
              ${vistaActual === 'cine' && idx === 0 ? '<span style="font-size: 20px;" title="Proyección Suprema">👑</span>' : ''}
            </div>

            <div class="card-hype-bar">
              <div class="card-hype-fill" style="width: ${post.hype_level || 50}%"></div>
            </div>

            <div class="post-body">${escapeHtml(post.contenido)}</div>

            ${postImgHtml}

            <div class="post-footer">
              <div class="reactions">
                <button class="react-btn ${haVotado(post.id, 'chad') ? 'reacted' : ''}" 
                  onclick="votar(${post.id}, 'chad')">
                  💔 <span>${post.chad_count || 0}</span>
                </button>
                <button class="react-btn ${haVotado(post.id, 'fuego') ? 'reacted' : ''}" 
                  onclick="votar(${post.id}, 'fuego')">
                  🚬 <span>${post.fuego_count || 0}</span>
                </button>
                <button class="react-btn ${haVotado(post.id, 'skull') ? 'reacted' : ''}" 
                  onclick="votar(${post.id}, 'skull')">
                  💀 <span>${post.skull_count || 0}</span>
                </button>
              </div>

              <button class="btn-capture" onclick="descargarTarjeta(${post.id})">
                📸 Captura
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function haVotado(id, tipo) {
      return localStorage.getItem(`reacc_${id}_${tipo}`) === "true";
    }

    window.votar = async function(id, tipo) {
      if (haVotado(id, tipo)) return;
      localStorage.setItem(`reacc_${id}_${tipo}`, "true");

      await supabase.rpc("reaccionar", { post_id: id, tipo_reaccion: tipo });
      cargarPosts();
    };

    window.descargarTarjeta = function(id) {
      const card = document.getElementById(`card-${id}`);
      html2canvas(card, { backgroundColor: "#12161f", scale: 2, useCORS: true }).then(canvas => {
        const link = document.createElement("a");
        link.download = `proyectada-${id}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    };

    document.getElementById("proyectada-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const isAnon = document.getElementById("anonimo-check").checked;
      const autorInput = document.getElementById("autor").value.trim();
      const autor = isAnon ? "@ProyectadoAnonimo" : autorInput;
      const contenido = document.getElementById("contenido").value.trim();
      const categoria = document.getElementById("categoria").value;
      const hype_level = parseInt(document.getElementById("hype-range").value);
      const imagen_url = document.getElementById("imagen-url").value.trim() || null;

      const { error } = await supabase.from("proyectadas").insert([{
        autor,
        contenido,
        categoria,
        hype_level,
        imagen_url
      }]);

      if (!error) {
        document.getElementById("contenido").value = "";
        document.getElementById("imagen-url").value = "";
        cargarPosts();
      } else {
        alert("Fallo al postear: " + error.message);
      }
    });

    supabase
      .channel("muro-realtime")
      .on("postgres_changes", { event: "*", schema: "public", table: "proyectadas" }, () => {
        cargarPosts();
      })
      .subscribe();

    function escapeHtml(str) {
      return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    cargarPosts();
  </script>
</body>
</html>
