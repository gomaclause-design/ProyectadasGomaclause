<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Muro de las Proyectadas</title>
  
  <!-- AQUÍ ESTÁ LA SOLUCIÓN: Nuevo CDN para evitar bloqueos en Venezuela -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root {
      --bg: #090c10;
      --card-bg: #12161f;
      --border: #252d3a;
      --accent: #79a8d8;
      --text: #c9d1d9;
      --text-muted: #6e7681;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 20px 14px 90px 14px; display: flex; flex-direction: column;
      align-items: center; min-height: 100vh;
    }
    .container { width: 100%; max-width: 650px; }

    /* ================= LOGIN ================= */
    #auth-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin-top: 10vh; width: 100%; max-width: 350px; background: var(--card-bg);
      padding: 30px 20px; border-radius: 12px; border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #auth-screen h2 { margin-bottom: 20px; color: #e6edf3; text-align: center; }
    .auth-input {
      background: #090c10; border: 1px solid var(--border); color: var(--text); 
      padding: 12px; border-radius: 6px; width: 100%; margin-bottom: 12px; font-size: 15px;
    }
    .auth-btn {
      width: 100%; background: #1f364d; color: #fff; font-weight: bold; border: 1px solid #388bfd44; 
      padding: 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; margin-bottom: 10px;
    }
    .auth-btn:hover:not(:disabled) { background: #264766; }
    .auth-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .auth-switch { color: var(--accent); font-size: 13px; cursor: pointer; text-align: center; }
    .auth-switch:hover { text-decoration: underline; }
    
    /* ESTILOS DEL ERROR */
    #auth-error { color: #f85149; font-size: 13px; margin-bottom: 12px; text-align: center; display: none; background: #3a1515; padding: 10px; border-radius: 6px; width: 100%; border: 1px solid #f85149;}

    /* ================= MURO PRINCIPAL ================= */
    #app-screen { display: none; width: 100%; }
    .hero-banner { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 24px; text-align: center; position: relative; }
    .hero-banner img { width: 100%; height: 200px; object-fit: cover; display: block; filter: brightness(0.85); }
    .hero-title { padding: 16px; }
    .hero-title h1 { font-size: 23px; color: #e6edf3; display: flex; justify-content: center; gap: 10px; }
    .hero-title p { font-size: 13px; color: var(--text-muted); margin-top: 6px; font-style: italic; }
    .logout-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); border: 1px solid var(--border); color: #fff; padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }

    form { background: var(--card-bg); border: 1px solid var(--border); padding: 18px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    textarea, select { background: #090c10; border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 6px; width: 100%; font-family: inherit;}
    .file-upload-box { border: 1px dashed var(--border); padding: 12px; border-radius: 8px; background: #090c10; }
    .custom-file-btn { background: #182230; border: 1px solid var(--border); color: var(--accent); padding: 8px 14px; border-radius: 6px; cursor: pointer; display: inline-block; font-size: 13px;}
    #input-file { display: none; }
    .preview-box { display: none; position: relative; margin-top: 10px; }
    .preview-box img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 6px; }
    .hype-container { background: #090c10; border: 1px solid var(--border); padding: 10px 14px; border-radius: 6px; }
    input[type="range"] { width: 100%; accent-color: #79a8d8; }
    .btn-submit { background: #1f364d; color: #fff; font-weight: bold; border: 1px solid #388bfd44; padding: 12px; border-radius: 6px; cursor: pointer; }

    /* Pestañas */
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 18px; border-bottom: 1px solid var(--border); padding-bottom: 8px; overflow-x: auto;}
    .tab-btn { background: transparent; border: none; color: var(--text-muted); font-size: 14px; font-weight: bold; cursor: pointer; padding: 8px 12px; border-radius: 6px; white-space: nowrap;}
    .tab-btn.active { color: #fff; background: var(--card-bg); border: 1px solid var(--border); }

    /* Rango de Owner */
    .owner-badge {
      display: inline-flex; align-items: center; gap: 4px; background: rgba(241, 224, 90, 0.1);
      border: 1px solid #d29922; color: #f1e05a; font-size: 11px; padding: 2px 6px;
      border-radius: 12px; margin-left: 6px; font-weight: bold; vertical-align: middle;
    }

    /* Tarjetas de Post */
    .post-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid #30363d; object-fit: cover; cursor: pointer;}
    .author-name { font-weight: bold; color: var(--accent); cursor: pointer; display: flex; align-items: center; flex-wrap: wrap;}
    .author-name:hover { text-decoration: underline; }
    .post-body { font-size: 15px; margin-bottom: 12px; white-space: pre-wrap; line-height: 1.5; }
    .post-image-box img { width: 100%; max-height: 380px; object-fit: cover; border-radius: 8px; margin-bottom: 12px;}
    .card-hype-bar { height: 3px; background: #182230; margin-bottom: 12px; }
    .card-hype-fill { height: 100%; background: linear-gradient(90deg, #388bfd, #8957e5); }
    .post-footer { display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 10px; }
    .react-btn, .btn-capture { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 16px; font-size: 12px; cursor: pointer; }
    .react-btn.reacted { border-color: var(--accent); color: var(--accent); }

    /* ================= SECCIÓN MI PERFIL ================= */
    #mi-perfil-container { display: none; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
    .profile-avatar-large { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--accent); object-fit: cover; margin-bottom: 15px; }
    .profile-username { font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 20px; display: flex; align-items: center; justify-content: center;}
    
    /* ================= MODAL PERFIL USUARIOS ================= */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 90%; max-width: 400px; text-align: center; position: relative; }
    .close-modal { position: absolute; top: 10px; right: 15px; background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
    .modal-bio { margin-top: 15px; font-size: 14px; color: var(--text); white-space: pre-wrap; line-height: 1.5; background: #090c10; padding: 12px; border-radius: 8px; border: 1px solid var(--border);}
  </style>
</head>
<body>

  <!-- ================= LOGIN / REGISTRO ================= -->
  <div id="auth-screen" class="container">
    <h2 id="auth-title">Entrar al Muro 🗿</h2>
    
    <div id="auth-error"></div>

    <input type="text" id="auth-username" class="auth-input" placeholder="Usuario (ej: Alex_Goma)" autocomplete="off" />
    <input type="password" id="auth-pass" class="auth-input" placeholder="Contraseña :3" />
    
    <button class="auth-btn" id="auth-main-btn" onclick="iniciarSesion()">Entrar</button>
    <div class="auth-switch" id="auth-toggle-btn" onclick="toggleAuthMode()">¿No tienes perfil? Regístrate aquí</div>
  </div>

  <!-- ================= APLICACIÓN ================= -->
  <div id="app-screen" class="container">
    <div class="hero-banner">
      <img src="https://i.postimg.cc/Y2xk6G7V/Proyectado1.webp" alt="Proyectado" />
      <button class="logout-btn" onclick="cerrarSesion()">Cerrar sesión</button>
      <div class="hero-title">
        <h1>🌧️ El Muro de las Proyectadas 🚬</h1>
      </div>
    </div>

    <!-- Pestañas -->
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-feed" onclick="cambiarVista('feed')">📜 Muro</button>
      <button class="tab-btn" id="tab-cine" onclick="cambiarVista('cine')">🎥 Salón Vip</button>
      <button class="tab-btn" id="tab-perfil" onclick="cambiarVista('perfil')">👤 Mi Perfil</button>
    </div>

    <!-- Feed Principal -->
    <div id="main-content">
      <form id="proyectada-form">
        <div style="font-size: 13px; color: var(--accent); margin-bottom: 5px; display: flex; align-items: center;">
          Posteando como: <b id="display-alias" style="margin-left: 5px;">@Cargando...</b>
        </div>
        <select id="categoria">
          <option value="LaExtraño">💔 #LaExtraño</option>
          <option value="Sadboy">🌧️ #Sadboy</option>
          <option value="Insomnio">🌙 #NochesDeInsomnio</option>
          <option value="MeIlusioné">🥀 #MeIlusioné</option>
          <option value="Desahogo">🕯️ #Desahogo</option>
        </select>
        <textarea id="contenido" rows="3" placeholder="Suelte ese desahogo melancólico..." required></textarea>
        
        <div class="file-upload-box">
          <label for="input-file" class="custom-file-btn">🖼️ Añadir foto</label>
          <input type="file" id="input-file" accept="image/*" />
          <div class="preview-box" id="preview-box">
            <img id="preview-img" src="" />
            <button type="button" class="btn-remove-img" onclick="quitarImagen()">✕</button>
          </div>
        </div>

        <div class="hype-container">
          <div class="hype-header">
            <span>Nivel de Bajón:</span>
            <span id="hype-value" style="color: #79a8d8;">50%</span>
          </div>
          <input type="range" id="hype-range" min="1" max="100" value="50" oninput="document.getElementById('hype-value').innerText = this.value + '%'" />
        </div>
        <button type="submit" class="btn-submit" id="submit-btn">Soltar Proyección</button>
      </form>

      <div id="posts-container">Cargando...</div>
    </div>

    <!-- Contenedor Mi Perfil -->
    <div id="mi-perfil-container">
      <img src="https://i.postimg.cc/y6TBmgK2/Proyectado2.webp" class="profile-avatar-large" />
      <div class="profile-username" id="mi-username">@Usuario</div>
      <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 10px; text-align: left;">Mi Biografía:</p>
      <textarea id="mi-biografia" rows="4" placeholder="Escribe algo sobre ti..."></textarea>
      <button class="btn-submit" style="width: 100%; margin-top: 10px;" onclick="guardarBiografia()">Guardar Perfil</button>
    </div>
  </div>

  <!-- Modal para ver perfiles -->
  <div class="modal-overlay" id="user-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="cerrarModal()">✕</button>
      <img src="https://i.postimg.cc/y6TBmgK2/Proyectado2.webp" class="profile-avatar-large" />
      <div class="profile-username" id="modal-username">@Usuario</div>
      <div class="modal-bio" id="modal-bio">Cargando biografía...</div>
    </div>
  </div>

  <!-- SCRIPTS Y LÓGICA -->
  <script>
    var modoRegistro = false;
    var usuarioActual = null;
    var usernameActual = "";
    var vistaActual = 'feed';
    var postsData = [];
    var imagenBase64 = null;
    var db = null;
    
    var OWNER_USERNAME = "Alex_Goma";

    function escapeHtml(str) { return (str||"").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    function generarEtiquetaOwner(username) {
      if(username === OWNER_USERNAME) {
        return `<span class="owner-badge">👑 Owner</span>`;
      }
      return "";
    }

    function mostrarErrorAuth(mensaje) {
      var errDiv = document.getElementById('auth-error');
      errDiv.innerHTML = "<b>❌ ATENCIÓN:</b><br/>" + mensaje;
      errDiv.style.display = 'block';
    }

    window.toggleAuthMode = function() {
      modoRegistro = !modoRegistro;
      document.getElementById('auth-title').innerText = modoRegistro ? "Crear Perfil Nuevo 👤" : "Entrar al Muro 🗿";
      document.getElementById('auth-main-btn').innerText = modoRegistro ? "Registrarme" : "Entrar";
      document.getElementById('auth-toggle-btn').innerText = modoRegistro ? "¿Ya tienes perfil? Inicia sesión" : "¿No tienes perfil? Regístrate aquí";
      document.getElementById('auth-error').style.display = 'none';
    };

    if (typeof window.supabase === 'undefined') {
      mostrarErrorAuth("Tu internet o navegador está bloqueando la base de datos.<br/><b>Solución:</b> Usa un VPN (como ProtonVPN o 1.1.1.1) y recarga la página.");
    } else {
      const SUPABASE_URL = "https://flwunvjuvudfpwkszlgn.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_gmT2QjKFkJOyP5cmrySmQA_XbKQWlMS";
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    async function verificarSesion() {
      if (!db) return;
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        usuarioActual = session.user;
        usernameActual = usuarioActual.user_metadata.username;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        
        const ownerTag = generarEtiquetaOwner(usernameActual);
        document.getElementById('display-alias').innerHTML = "@" + escapeHtml(usernameActual) + ownerTag;
        document.getElementById('mi-username').innerHTML = "@" + escapeHtml(usernameActual) + ownerTag;
        
        cargarPosts();
        cargarMiPerfil();
      } else {
        document.getElementById('auth-screen').style.display = 'flex';
        document.getElementById('app-screen').style.display = 'none';
      }
    }

    window.iniciarSesion = async function() {
      if (!db) return mostrarErrorAuth("Supabase no ha cargado. Verifica tu conexión o enciende un VPN.");
      
      const usernameInput = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-pass').value;
      const btn = document.getElementById('auth-main-btn');
      
      document.getElementById('auth-error').style.display = 'none';

      if (!usernameInput || !password) {
        return mostrarErrorAuth("Llena el usuario y la contraseña por favor.");
      }

      if (password.length < 6) {
        return mostrarErrorAuth("La contraseña debe tener mínimo 6 caracteres.");
      }
      
      const fakeEmail = usernameInput.toLowerCase() + "@muro.com";
      
      btn.innerText = "Cargando...";
      btn.disabled = true;

      try {
        if (modoRegistro) {
          const { data, error } = await db.auth.signUp({
            email: fakeEmail,
            password: password,
            options: { data: { username: usernameInput } }
          });
          
          if (error) {
            if(error.message.includes("already registered") || error.message.includes("User already registered")) throw new Error("Ese nombre de usuario ya está registrado. Intenta iniciar sesión.");
            throw error;
          }
          
          if (data.user) {
            await db.from('perfiles').insert([{ id: data.user.id, username: usernameInput }]);
            alert("¡Perfil creado con éxito!");
            await verificarSesion();
          }
        } else {
          const { data, error } = await db.auth.signInWithPassword({ email: fakeEmail, password: password });
          if (error) throw new Error("La cuenta no existe o la contraseña es incorrecta.");
          await verificarSesion();
        }
      } catch (err) {
        mostrarErrorAuth(err.message);
      } finally {
        btn.innerText = modoRegistro ? "Registrarme" : "Entrar";
        btn.disabled = false;
      }
    };

    window.cerrarSesion = async function() {
      if(db) await db.auth.signOut();
      usuarioActual = null;
      verificarSesion();
    };

    window.cambiarVista = function(vista) {
      vistaActual = vista;
      document.getElementById('tab-feed').classList.toggle('active', vista === 'feed');
      document.getElementById('tab-cine').classList.toggle('active', vista === 'cine');
      document.getElementById('tab-perfil').classList.toggle('active', vista === 'perfil');
      
      if(vista === 'perfil') {
        document.getElementById('main-content').style.display = 'none';
        document.getElementById('mi-perfil-container').style.display = 'block';
      } else {
        document.getElementById('main-content').style.display = 'block';
        document.getElementById('mi-perfil-container').style.display = 'none';
        renderPosts();
      }
    };

    async function cargarMiPerfil() {
      if(!db) return;
      const { data, error } = await db.from('perfiles').select('biografia').eq('id', usuarioActual.id).single();
      if(data && data.biografia) document.getElementById('mi-biografia').value = data.biografia;
    }

    window.guardarBiografia = async function() {
      const bio = document.getElementById('mi-biografia').value.trim();
      const { error } = await db.from('perfiles').update({ biografia: bio }).eq('id', usuarioActual.id);
      if(error) alert("Error al guardar: " + error.message);
      else alert("¡Biografía actualizada!");
    };

    window.abrirPerfil = async function(usernameClick) {
      const ownerTag = generarEtiquetaOwner(usernameClick);
      document.getElementById('modal-username').innerHTML = "@" + escapeHtml(usernameClick) + ownerTag;
      document.getElementById('modal-bio').innerText = "Cargando biografía...";
      document.getElementById('user-modal').style.display = 'flex';

      const { data, error } = await db.from('perfiles').select('biografia').eq('username', usernameClick).single();
      
      if(data) document.getElementById('modal-bio').innerText = data.biografia || "Este usuario aún no tiene biografía.";
      else document.getElementById('modal-bio').innerText = "Perfil no encontrado.";
    };

    window.cerrarModal = function() {
      document.getElementById('user-modal').style.display = 'none';
    };

    document.getElementById('user-modal').addEventListener('click', function(e) {
      if(e.target === this) cerrarModal();
    });

    document.getElementById("input-file").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.src = event.target.result;
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 800; let width = img.width, height = img.height;
          if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          canvas.width = width; canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          imagenBase64 = canvas.toDataURL("image/jpeg", 0.7);
          document.getElementById("preview-img").src = imagenBase64;
          document.getElementById("preview-box").style.display = "block";
        };
      };
      reader.readAsDataURL(file);
    });

    window.quitarImagen = function() {
      imagenBase64 = null; document.getElementById("input-file").value = "";
      document.getElementById("preview-box").style.display = "none";
    };

    async function cargarPosts() {
      if(!db) return;
      const { data, error } = await db.from("proyectadas").select("*").order("created_at", { ascending: false });
      if (!error) { postsData = data; renderPosts(); }
    }

    function renderPosts() {
      if(vistaActual === 'perfil') return; 
      const container = document.getElementById("posts-container");
      let lista = [...postsData];
      if (vistaActual === 'cine') {
        lista.sort((a, b) => ((b.chad_count||0)+(b.fuego_count||0)+(b.skull_count||0)) - ((a.chad_count||0)+(a.fuego_count||0)+(a.skull_count||0)));
      }
      if (lista.length === 0) return container.innerHTML = `<div style="text-align:center; padding: 20px;">No hay desahogos todavía.</div>`;

      container.innerHTML = lista.map((post) => {
        let imgHtml = post.imagen_url ? `<div class="post-image-box"><img src="${post.imagen_url}"/></div>` : "";
        let ownerTag = generarEtiquetaOwner(post.autor);
        
        return `
          <div class="post-card" id="card-${post.id}">
            <div class="post-header">
              <img class="avatar" src="https://i.postimg.cc/y6TBmgK2/Proyectado2.webp" onclick="abrirPerfil('${escapeHtml(post.autor)}')" />
              <div>
                <div class="author-name" onclick="abrirPerfil('${escapeHtml(post.autor)}')">@${escapeHtml(post.autor)} ${ownerTag}</div>
                <div style="font-size: 11px; color: var(--text-muted);">
                  ${new Date(post.created_at).toLocaleDateString()} • #${escapeHtml(post.categoria)}
                </div>
              </div>
            </div>
            <div class="card-hype-bar"><div class="card-hype-fill" style="width: ${post.hype_level || 50}%"></div></div>
            <div class="post-body">${escapeHtml(post.contenido)}</div>
            ${imgHtml}
            <div class="post-footer">
              <div class="reactions">
                <button class="react-btn" onclick="votar(${post.id}, 'chad')">💔 <span>${post.chad_count || 0}</span></button>
                <button class="react-btn" onclick="votar(${post.id}, 'fuego')">🚬 <span>${post.fuego_count || 0}</span></button>
                <button class="react-btn" onclick="votar(${post.id}, 'skull')">💀 <span>${post.skull_count || 0}</span></button>
              </div>
              <button class="btn-capture" onclick="descargarTarjeta(${post.id})">📸 Captura</button>
            </div>
          </div>
        `;
      }).join("");
    }

    window.votar = async function(id, tipo) {
      if (!db || localStorage.getItem(`voto_${id}_${tipo}`)) return;
      localStorage.setItem(`voto_${id}_${tipo}`, "true");
      await db.rpc("reaccionar", { post_id: id, tipo_reaccion: tipo });
      cargarPosts();
    };

    window.descargarTarjeta = function(id) {
      const card = document.getElementById(`card-${id}`);
      html2canvas(card, { backgroundColor: "#12161f", scale: 2, useCORS: true }).then(canvas => {
        const link = document.createElement("a"); link.download = `proyectada-${id}.png`;
        link.href = canvas.toDataURL("image/png"); link.click();
      });
    };

    document.getElementById("proyectada-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if(!db) return;
      const btn = document.getElementById("submit-btn");
      btn.disabled = true; btn.innerText = "Publicando...";

      const contenido = document.getElementById("contenido").value.trim();
      const categoria = document.getElementById("categoria").value;
      const hype_level = document.getElementById("hype-range").value;

      await db.from("proyectadas").insert([{
        autor: usernameActual, contenido, categoria, hype_level, imagen_url: imagenBase64
      }]);

      document.getElementById("contenido").value = "";
      quitarImagen();
      cargarPosts();
      btn.disabled = false; btn.innerText = "Soltar Proyección";
    });

    if(db) {
      try { db.channel("muro-realtime").on("postgres_changes", { event: "*", schema: "public", table: "proyectadas" }, cargarPosts).subscribe(); } catch(e){}
      verificarSesion();
    }
  </script>
</body>
</html>
